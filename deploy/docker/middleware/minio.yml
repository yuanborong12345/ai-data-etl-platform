version: "3.9"

services:
  minio:
    image: quay.io/minio/minio
    container_name: etl-platform-minio
    restart: unless-stopped

    ports:
      - "9000:9000"
      - "9001:9001"

    environment:
      MINIO_ROOT_USER: MINIO_ROOT_USER
      MINIO_ROOT_PASSWORD: MINIO_ROOT_PASSWORD

    volumes:
      - ./data:/data

    command: server /data --console-address ":9001"