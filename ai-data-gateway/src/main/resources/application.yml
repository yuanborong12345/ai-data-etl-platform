server:
  port: 8000
# 网关配置
spring:
  profiles:
    active: dev
  application:
    name: ai-data-gateway
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_HOST}:${NACOS_PORT}
        namespace: ${NACOS_NAMESPACE}
        group: ${NACOS_GROUP}
    gateway:
      server:
        webflux:
          routes:
            # ==========================================
            # user 服务业务路由
            # ==========================================
            - id: ai-data-user
              uri: lb://ai-data-user
              predicates:
                - Path=/api/user/**
              filters:
                - StripPrefix=1
logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.cloud.loadbalancer: TRACE

jwt:
  secret: ${JWT_SECRET_KEY}
