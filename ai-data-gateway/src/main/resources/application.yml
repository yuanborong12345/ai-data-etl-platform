server:
  port: 8000
# 网关配置
spring:
  profiles:
    active: dev
  application:
    name: ai-data-gateway
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_HOST}:${NACOS_PORT}
        namespace: ${NACOS_NAMESPACE}
        group: ${NACOS_GROUP}
    gateway:
      routes:
        # ==========================================
        # user 服务业务路由
        # ==========================================
        - id: ai-data-user
          uri: lb://ai-data-user
          predicates:
            - Path=/api/user/**
        # ==========================================
        # intelligence 服务业务路由
        # ==========================================
        - id: ai-data-intelligence
          uri: lb://ai-data-intelligence
          predicates:
            - Path=/api/intelligence/**
        # ==========================================
        # monitor 服务业务路由
        # ==========================================
        - id: ai-data-monitor
          uri: lb://ai-data-monitor
          predicates:
            - Path=/api/monitor/**

jwt:
  secret: ${JWT_SECRET_KEY}
