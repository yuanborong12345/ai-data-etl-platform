# 端口配置
server:
  port: 8000
# 网关配置
spring:
  profiles:
    active: dev
  application:
    name: ai-data-gateway
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_HOST}:${NACOS_PORT}
    gateway:
      routes:
        # ==========================================
        # user 服务业务路由
        # ==========================================
        - id: ai-data-user
          uri: lb://ai-data-user
          predicates:
            - Path=/api/user/**
        # ==========================================
        # intelligence 服务业务路由
        # ==========================================
        - id: ai-data-intelligence
          uri: lb://ai-data-intelligence
          predicates:
            - Path=/api/intelligence/**
        # ==========================================
        # monitor 服务业务路由
        # ==========================================
        - id: ai-data-monitor
          uri: lb://ai-data-monitor
          predicates:
            - Path=/api/monitor/**
# swagger 文档配置
knife4j:
  gateway:
    enabled: true
    strategy: manual
    routes:
      - name: 用户服务
        service-name: ai-data-user
        # 【核心魔法】：直接请求网关的业务路径，网关透传给后端，后端带着 context-path 完美接客！
        url: /api/user/v3/api-docs
        context-path: /api/user
        order: 1
      - name: 智能服务
        service-name: ai-data-intelligence
        url: /api/intelligence/v3/api-docs
        order: 2
      - name: 监控服务
        service-name: ai-data-monitor
        url: /api/monitor/v3/api-docs
        order: 3
# jwt 配置
jwt:
  secret: ai-data-etl-platform-jwt-secret-key-2026-excel-ai