server:
  port: 8010
  servlet:
    context-path: /api/user
spring:
  profiles:
    active: dev
  application:
    name: ai-data-user
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
  datasource:
    url: jdbc:mysql://localhost:3306/ai_data_etl_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: abc123
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password:
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest
    publisher-confirm-type: correlated # 开启发送确认
    publisher-returns: true            # 开启发送失败返回
# ======================================================
jwt:
  secret: ai-data-etl-platform-jwt-secret-key-2025-spring-cloud
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      table-underline: false
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0
  type-aliases-package: com.yuan.model.entity
  mapper-locations: classpath:mapper/*.xml
knife4j:
  enable: true

file:
  storage:
    # 激活策略
    active-type: minio
    # 允许上传的文件扩展名白名单（空列表表示不限制）
    allowed-file-types: txt, json, xml, zip, rar
    # 暂存模式：开启后文件先写入暂存路径，确认使用后通过 promote() 转移至久存路径
    stage-mode: false
    stage-prefix: staging
    # 容错配置（重试 + 熔断）
    resilience:
      # 启用/禁用重试机制
      retry-enabled: true
      # 重试次数
      max-attempts: 3
      # 重试间隔（毫秒）
      backoff-millis: 200
      #
      circuit-enabled: true
      failure-threshold: 5
      open-duration-millis: 30000
    # 可选存储服务策略
    aliyun:
      enabled: false
      path-prefix: uploads
      public-url:
      endpoint:
      bucket-name:
      access-key-id:
      access-key-secret:
    minio:
      enabled: true
      path-prefix: uploads
      public-url:
      endpoint: https://${MINIO_HOST}:${MINIO_PORT}
      bucket-name: etl-platform-data
      access-key: ${MINIO_ACCESS_KEY}
      secret-key: ${MINIO_SECRET_KEY}
